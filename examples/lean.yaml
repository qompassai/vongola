# Lean profile for a single small device (dev kit, thin client):
# two worker threads, NAT mapping opt-in on the HTTPS listener,
# one local upstream, admin on loopback only.

bundle_version: "1"
listeners:
  admin:
    bind: "127.0.0.1:9091"
  http:
    bind: "0.0.0.0:8080"
  https:
    bind: "0.0.0.0:4433"
    nat:
      enabled: false
      lease_secs: 3600
      protocols: ["pcp", "natpmp", "upnp"]
node_name: "lean-1"
profile: lean
routes:
  - host: "device.test"
    security_headers: true
    self_signed_fallback: true
    upstreams:
      - address: "127.0.0.1:8000"
state_dir: "./vongola-state"
worker_threads: 2
