# Fleet profile: identical shared-nothing nodes running the same
# versioned bundle (verify bundle_version + sha256 via /api/state
# on every node). Copy this file per node, change node_name and
# ports only. Chained egress, Tor onion service, and peer
# discovery are all opt-in knobs below.

bundle_version: "1"
discovery:
  docker_enabled: false
  docker_endpoint: "unix:///var/run/docker.sock"
  interval_secs: 15
fleet_peers: []
listeners:
  admin:
    bind: "127.0.0.1:9091"
  http:
    bind: "0.0.0.0:8080"
  https:
    bind: "0.0.0.0:4433"
node_name: "fleet-1"
profile: fleet
routes:
  - host: "fleet.test"
    security_headers: true
    self_signed_fallback: true
    upstreams:
      - address: "127.0.0.1:8000"
      - address: "127.0.0.1:8001"
state_dir: "./vongola-state"
tor:
  enabled: false
  control_addr: "127.0.0.1:9051"
  socks_addr: "127.0.0.1:9050"
worker_threads: 2
