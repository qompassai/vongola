# The qompass.ai hosting profile: apex serves the static site,
# www redirects to apex, /api/* proxies to a local service.
# Certificates are operator-supplied; uncomment
# self_signed_fallback for a first local run.

a2a:
  enabled: true
  name: "vongola-qompass"
  skills: ["reverse-proxy", "static-hosting"]
bundle_version: "1"
listeners:
  admin:
    bind: "127.0.0.1:9091"
  http:
    bind: "0.0.0.0:8080"
  https:
    bind: "0.0.0.0:4433"
node_name: "qompass-edge-1"
profile: hosting
routes:
  - host: "qompass.ai"
    additional_hosts: ["www.qompass.ai"]
    redirect_www_to_apex: true
    security_headers: true
    static_root: "./examples/site"
    cache:
      enabled: true
      max_age_secs: 3600
    upstreams: []
  - host: "qompass.ai"
    name: "qompass-api"
    path_prefixes: ["/api/*"]
    security_headers: true
    upstreams:
      - address: "127.0.0.1:3000"
state_dir: "./vongola-state"
worker_threads: 4
