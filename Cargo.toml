[workspace]
# crates/vongola-mcp (the read-only operator MCP client) is a
# member but not a default member: a plain `cargo build` and the
# flake's package build compile vongola alone, unchanged. Build
# it with `cargo build -p vongola-mcp` (or `--workspace`).
default-members = ["crates/vongola"]
# crates/vongola-ech is a workspace member with its own version
# (D-302) so it can be published to crates.io in its own right —
# vongola's `ech` feature depends on it by version + path, and a
# path-only dependency is rejected by crates.io. It is not a
# default member: it only builds against OpenSSL >= 4.0, while
# the default build targets the system OpenSSL. Build it with
# `cargo build -p vongola-ech` in an OpenSSL 4 environment.
members = ["crates/vongola", "crates/vongola-ech", "crates/vongola-mcp"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[profile.release]
lto = "thin"
