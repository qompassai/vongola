[package]
name = "vongola-ech"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
description = "Safe Rust wrapper for the OpenSSL 4.0 Encrypted Client Hello (ECH, RFC 9849) server APIs: OSSL_ECHSTORE lifecycle, SSL_CTX attachment, and per-connection ECH status."
keywords = ["ech", "encrypted-client-hello", "openssl", "rfc9849", "tls"]
categories = ["cryptography", "network-programming"]

# This crate is deliberately NOT a member of the parent vongola
# workspace: it compiles only against OpenSSL >= 4.0, while the
# parent workspace's default build targets OpenSSL 3.5. It joins
# the parent build solely as an optional path dependency behind
# vongola's `ech` cargo feature (see crates/vongola/Cargo.toml).
[workspace]

[dependencies]
base64 = "0.22"
libc = "0.2"
openssl-sys = "0.9"
