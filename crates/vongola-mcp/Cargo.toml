[package]
name = "vongola-mcp"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Read-only, operator-local stdio MCP server over a running vongola daemon's admin surfaces."

[[bin]]
name = "vongola-mcp"
path = "src/main.rs"

[dependencies]
# rmcp is pinned to the fleet version (D-113 standardization): one
# SDK version across every estate MCP server, modern era only.
rmcp = { version = "=3.8.0", features = ["server", "transport-io"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
