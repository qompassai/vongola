[package]
name = "vongola-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Read-only, operator-local stdio MCP server over a running vongola daemon's admin surfaces."

[[bin]]
name = "vongola-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1"
serde_yaml = "0.9"
