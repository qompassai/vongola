[package]
name = "vongola"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Clean-room reverse proxy and web server on Pingora 0.9: PQ-hybrid TLS, MCP/A2A operator surfaces, NAT traversal, Tor onion services, proxy chains."

[[bin]]
name = "vongola"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1"
foreign-types-shared = "0.1"
hmac = "0.12"
http = "1"
log = "0.4"
openssl = "0.10"
pingora = { version = "=0.9.0", features = ["lb", "openssl"] }
rand = "0.8"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
time = "0.3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
vongola-ech = { path = "../vongola-ech", optional = true }

[features]
# ECH (RFC 9849) via the vongola-ech binding crate. Enabled
# only by the flake's OpenSSL 4 variant: the binding requires
# OpenSSL >= 4.0 headers, which the default (OpenSSL 3.5)
# build does not have. See SPEC.md section 16.
ech = ["dep:vongola-ech"]

[dev-dependencies]
tempfile = "3"
