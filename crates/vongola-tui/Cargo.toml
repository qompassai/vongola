[package]
name = "vongola-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fleet-pattern TUI for vongola-mcp: operator console over the five read-only daemon tools, plan/auto staging, and the cross-MCP trigger layer."

[[bin]]
name = "vongola-tui"
path = "src/main.rs"

[dependencies]
# vongola-mcp is a server-only binary crate (no library), so the real
# facade is an MCP stdio client spawning the member's own server
# binary (DESIGN SS D2 fallback route). No rmcp dependency: the
# client speaks the modern-era JSON-RPC framing directly, bounded.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rule files are TOML data (DESIGN SS D4).
toml = "0.9"
sha2 = "0.10"
# ratatui + crossterm: the fleet TUI pattern's rendering pair, at the
# versions the pattern pilot (theodolite-tui) uses.
ratatui = "0.30"
crossterm = "0.29"
